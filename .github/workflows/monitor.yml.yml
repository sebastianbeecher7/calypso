name: Monitor Trattoria Calypso

on:
  schedule:
    - cron: "13,28,43,58 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Enviar solo un mensaje de prueba"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: calypso
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Revisar disponibilidad
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFY: ${{ inputs.test && '1' || '0' }}
        run: python monitor.py

      - name: Guardar estado
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git pull --rebase origin main
            git push
          fi
